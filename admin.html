<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech It Out | Admin Dashboard</title>
<link rel="icon" href="images/Tech_It_Out_Profile_Picture_V2.png">
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:1250px;margin:auto;padding:60px 5vw}.admin-top{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.admin-panel{background:white;border:1px solid var(--border);border-radius:18px;padding:25px;margin-top:25px;box-shadow:var(--shadow)}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:13px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.admin-table th{font-size:.8rem;text-transform:uppercase}.admin-table-wrap{overflow:auto}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:var(--brand-pale);border-radius:14px}.stat strong{font-size:2rem;display:block}.login-box{max-width:450px;margin:10vh auto}.hidden{display:none!important}@media(max-width:700px){.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><img src="images/Tech_It_Out_Profile_Picture_V2.png" alt="Tech It Out logo"><span>Tech It Out Admin</span></a><a href="index.html" class="btn btn-secondary">View Website</a></header>
<main class="admin-wrap">
<section id="login" class="login-box">
<div class="section-heading"><span class="eyebrow">PRIVATE AREA</span><h2>Admin Dashboard</h2><p>Sign in to manage enquiries once the production authentication backend is connected.</p></div>
<form id="login-form" class="form-card"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn btn-primary">Sign In</button><p class="form-status"></p></form>
</section>
<section id="dashboard" class="hidden">
<div class="admin-top"><div><span class="eyebrow">TECH IT OUT</span><h1>Dashboard</h1><p>Enquiries, repair requests and website activity.</p></div><button id="logout" class="btn btn-secondary">Sign Out</button></div>
<div class="stat-grid"><div class="stat"><span>Total enquiries</span><strong id="total">—</strong></div><div class="stat"><span>Unread</span><strong id="unread">—</strong></div><div class="stat"><span>Repairs</span><strong id="repairs">—</strong></div></div>
<div class="admin-panel"><div class="admin-top"><h2>Messages</h2><button id="refresh" class="btn btn-secondary">Refresh</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Name</th><th>Contact</th><th>Type</th><th>Message</th><th>Status</th></tr></thead><tbody id="messages"></tbody></table></div></div>
</section>
</main>
<script>
const API_BASE = window.TECH_IT_OUT_API || "/api";
const login = document.querySelector("#login"), dash = document.querySelector("#dashboard");
function status(m,ok=false){const e=document.querySelector("#login-form .form-status");e.textContent=m;e.style.color=ok?"#138a54":"#b42318"}
async function load(){
  const token=sessionStorage.getItem("techitout_admin_token");
  if(!token)return;
  const r=await fetch(`${API_BASE}/admin/messages`,{headers:{Authorization:`Bearer ${token}`}});
  if(r.status===401){sessionStorage.removeItem("techitout_admin_token");return}
  const d=await r.json();
  document.querySelector("#total").textContent=d.stats.total;
  document.querySelector("#unread").textContent=d.stats.unread;
  document.querySelector("#repairs").textContent=d.stats.repairs;
  document.querySelector("#messages").innerHTML=d.messages.map(m=>`<tr><td>${new Date(m.created_at).toLocaleString()}</td><td>${esc(m.name)}</td><td>${esc(m.email)}<br>${esc(m.phone||"")}</td><td>${esc(m.type)}</td><td>${esc(m.message)}</td><td>${esc(m.status)}</td></tr>`).join("");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
document.querySelector("#login-form").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{const r=await fetch(`${API_BASE}/admin/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");sessionStorage.setItem("techitout_admin_token",d.token);login.classList.add("hidden");dash.classList.remove("hidden");load();}catch(x){status(x.message)}finally{b.disabled=false}});
document.querySelector("#logout").onclick=()=>{sessionStorage.removeItem("techitout_admin_token");location.reload()};
document.querySelector("#refresh").onclick=load;
if(sessionStorage.getItem("techitout_admin_token")){login.classList.add("hidden");dash.classList.remove("hidden");load()}
</script>
</body></html>
